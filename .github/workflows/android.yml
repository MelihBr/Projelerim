name: Android APK

on:
  push:
    branches: [claude/peaceful-albattani-ivjrdd]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AltyaziCevirmeni.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziCevirmeni
          path: AltyaziCevirmeni.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: Altyazı Çevirmeni (Android)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Telefona indirip kur. Kurulurken "bilinmeyen kaynaklardan yüklemeye izin ver" demen gerekebilir.
          files: AltyaziCevirmeni.apk
